# WerkHub: publish the complete project ZIP uploaded from an iPhone.
# Keep the ZIP filename exactly as specified in the command below.
# For future website updates, replace that ZIP with the updated complete project.

[build]
  base = "."
  command = "python3 -m zipfile -e WerkHub-Alles-Intern-Netlify.zip werkhub-site"
  publish = "werkhub-site"
